name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned dependencies
        run: python -m pip install -r requirements.txt pytest==8.3.3
      - name: Unit tests on synthetic data (no dataset needed)
        run: python -m pytest -q
